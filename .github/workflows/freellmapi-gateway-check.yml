name: FreeLLMAPI Gateway Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FREELLMAPI_BASE_URL: ${{ secrets.FREELLMAPI_BASE_URL }}
      TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
      FREELLMAPI_API_KEY: ${{ secrets.FREELLMAPI_API_KEY }}
    steps:
      - name: Validate required secrets
        run: |
          set -euo pipefail
          test -n "$FREELLMAPI_BASE_URL" || { echo "::error::Missing FREELLMAPI_BASE_URL"; exit 1; }
          test -n "$FREELLMAPI_API_KEY" || { echo "::error::Missing FREELLMAPI_API_KEY"; exit 1; }

      - name: Connect to private Android gateway over Tailscale
        if: ${{ env.TAILSCALE_AUTHKEY != '' }}
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ env.TAILSCALE_AUTHKEY }}

      - name: Check authenticated model catalogue (no inference)
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 \
            "${FREELLMAPI_BASE_URL%/}/models" \
            -H "Authorization: Bearer $FREELLMAPI_API_KEY" \
            -o /tmp/freellmapi-models.json
          python - <<'PY'
          import json
          with open("/tmp/freellmapi-models.json", encoding="utf-8") as f:
              data = json.load(f)
          models = data.get("data")
          if not isinstance(models, list) or not models:
              raise SystemExit("FreeLLMAPI returned an empty or invalid model list.")
          print(f"SUCCESS: FreeLLMAPI is reachable and lists {len(models)} model(s).")
          print("No text-generation request was sent.")
          PY
