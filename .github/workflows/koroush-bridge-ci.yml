name: KOROUSH Central Bridge CI

on:
  pull_request:
    branches: [main]
  push:
    branches: ["integration/koroush-central-bridge"]

permissions:
  contents: read

jobs:
  bridge-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile bridge
        run: python -m py_compile scripts/koroush_central_bridge.py
      - name: Run offline contract and discovery tests
        run: python -m unittest discover -s tests -p 'test_koroush_central_bridge.py' -v
      - name: Validate CLI without network access
        run: python scripts/koroush_central_bridge.py --help
