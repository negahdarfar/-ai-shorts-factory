name: MoneyPrinterTurbo Shorts Factory

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      count:
        description: Number of Shorts for the quality test
        required: true
        default: "4"
        type: choice
        options:
          - "1"
          - "2"
          - "4"

permissions:
  contents: read

concurrency:
  group: mpt-shorts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      MPT_HOME: ${{ runner.temp }}/mpt-runtime
      MPT_SOURCE_DIR: ${{ github.workspace }}/vendor/MoneyPrinterTurbo
    steps:
      - name: Checkout this factory
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Get MoneyPrinterTurbo v1.3.10
        run: |
          git clone --depth 1 --branch v1.3.10 https://github.com/harry0703/MoneyPrinterTurbo.git vendor/MoneyPrinterTurbo
      - name: Install the official engine
        working-directory: vendor/MoneyPrinterTurbo
        run: |
          python -m pip install --upgrade pip
          pip install .
      - name: Restore previously used topic list
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/mpt-runtime/state
          key: mpt-topics-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            mpt-topics-${{ runner.os }}-
      - name: Configure free-tier providers
        id: configure
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python scripts/configure_moneyprinter.py
      - name: Discover fresh trending topics
        if: steps.configure.outputs.ready == 'true'
        run: python scripts/build_trending_batch.py --count ${{ inputs.count || '4' }} --geo US --state-dir "$MPT_HOME/state"
      - name: Generate vertical videos (no upload)
        if: steps.configure.outputs.ready == 'true'
        working-directory: vendor/MoneyPrinterTurbo
        run: |
          mpt cli --batch-file "$GITHUB_WORKSPACE/trending_batch.json" --video-source ${{ steps.configure.outputs.video_source }} --video-aspect 9:16 --video-language en-US --voice-name en-US-GuyNeural --subtitle-enabled --subtitle-display-mode word_by_word --subtitle-animation pop_spring --subtitle-position bottom --video-fit-mode cover --bgm-volume 0.12 --stop-at video
      - name: Validate generated vertical videos
        if: steps.configure.outputs.ready == 'true'
        env:
          EXPECTED_COUNT: ${{ inputs.count || '4' }}
        run: python scripts/validate_mpt_outputs.py
      - name: Collect output files
        if: always()
        run: |
          mkdir -p artifacts
          if [ -d "$MPT_HOME/storage/tasks" ]; then cp -R "$MPT_HOME/storage/tasks" artifacts/; fi
          if [ -d "$MPT_HOME/logs" ]; then cp -R "$MPT_HOME/logs" artifacts/; fi
          cp trending_batch.json selected_trends.json 2>/dev/null artifacts/ || true
          cp mpt_quality_report.json artifacts/ 2>/dev/null || true
      - name: Save videos, selected topics and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moneyprinterturbo-quality-test
          path: |
            artifacts/
          if-no-files-found: warn
          retention-days: 7
