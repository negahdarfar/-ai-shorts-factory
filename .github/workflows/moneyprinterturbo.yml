name: MoneyPrinterTurbo Shorts Factory

on:
  workflow_dispatch:
    inputs:
      count:
        description: Number of Shorts for the quality test
        required: true
        default: "4"
        type: choice
        options:
          - "1"
          - "2"
          - "4"

permissions:
  contents: read

concurrency:
  group: mpt-shorts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      MPT_HOME: ${{ runner.temp }}/mpt-runtime
      MPT_SOURCE_DIR: ${{ github.workspace }}/vendor/MoneyPrinterTurbo
    steps:
      - name: Checkout this factory
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Get MoneyPrinterTurbo v1.3.10
        run: |
          git clone --depth 1 --branch v1.3.10 https://github.com/harry0703/MoneyPrinterTurbo.git vendor/MoneyPrinterTurbo
      - name: Install the official engine
        working-directory: vendor/MoneyPrinterTurbo
        run: |
          python -m pip install --upgrade pip
          pip install .
      - name: Configure free-tier providers
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python scripts/configure_moneyprinter.py
      - name: Discover fresh trending topics
        run: python scripts/build_trending_batch.py --count ${{ inputs.count }} --geo US --state-dir "$MPT_HOME/state"
      - name: Generate vertical videos (no upload)
        working-directory: vendor/MoneyPrinterTurbo
        run: |
          mpt cli --batch-file "$GITHUB_WORKSPACE/trending_batch.json" --video-source pexels --video-aspect 9:16 --video-language en-US --voice-name en-US-GuyNeural --subtitle-enabled --subtitle-display-mode word_by_word --subtitle-animation pop_spring --subtitle-position bottom --video-fit-mode cover --bgm-volume 0.12 --stop-at video
      - name: Save videos, selected topics and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moneyprinterturbo-quality-test
          path: |
            mpt-runtime/storage/tasks/
            mpt-runtime/logs/
            trending_batch.json
            selected_trends.json
          if-no-files-found: warn
          retention-days: 7
