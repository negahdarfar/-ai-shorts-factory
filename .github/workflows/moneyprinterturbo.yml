name: MoneyPrinterTurbo Shorts Factory

"on":
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 14 * * *" # Daily UTC production; release times are staggered after rendering.
  workflow_dispatch:
    inputs:
      use_phone_gateway:
        description: 'Connect to the Android FreeLLMAPI gateway through Tailscale (requires the phone to be online)'
        required: false
        type: boolean
        default: false
      use_previous_four_topics:
        description: 'Reuse the four preserved topics from the previous run'
        required: false
        type: boolean
        default: false
      publish_four_public:
        description: 'Publish all four validated videos PUBLIC on YouTube (manual runs only; daily schedule is separate)'
        required: false
        type: boolean
        default: false
      upload_four_private_tests:
        description: 'Upload all four validated Shorts as PRIVATE QA tests'
        required: false
        type: boolean
        default: false
      upload_private_test:
        description: 'Upload exactly one validated Short as PRIVATE for connection testing'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mpt-shorts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      FREELLMAPI_BASE_URL: ${{ secrets.FREELLMAPI_BASE_URL }}
      TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
      MPT_HOME: ${{ github.workspace }}/mpt-runtime
      MPT_SOURCE_DIR: ${{ github.workspace }}/vendor/MoneyPrinterTurbo
    steps:
      - name: Checkout this factory
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg
        if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core
      - name: Get MoneyPrinterTurbo v1.3.10
        if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
        run: git clone --depth 1 --branch v1.3.10 https://github.com/harry0703/MoneyPrinterTurbo.git vendor/MoneyPrinterTurbo
      - name: Install small config helper
        if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
        run: python -m pip install toml
      - name: Restore previously used topic list
        if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/mpt-runtime/state
          key: mpt-topics-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            mpt-topics-${{ runner.os }}-
      - name: Connect to private FreeLLMAPI phone gateway
        if: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && (inputs.use_phone_gateway == true || vars.USE_PHONE_FREELLMAPI == 'true') && env.FREELLMAPI_BASE_URL != '' && env.TAILSCALE_AUTHKEY != '' }}
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ env.TAILSCALE_AUTHKEY }}
      - name: Check FreeLLMAPI gateway without inference
        if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
        id: freeapi
        env:
          BASE_URL: ${{ (inputs.use_phone_gateway == true || vars.USE_PHONE_FREELLMAPI == 'true') && secrets.FREELLMAPI_BASE_URL || '' }}
          API_KEY: ${{ secrets.FREELLMAPI_API_KEY }}
        run: |
          set -euo pipefail
          READY=false
          if [ -n "$BASE_URL" ] && [ -n "$API_KEY" ]; then
            if curl --fail --silent --show-error --max-time 20 "${BASE_URL%/}/models" \
              -H "Authorization: Bearer $API_KEY" -o /tmp/freellmapi-models.json; then
              if python - <<'PY'
          import json
          with open("/tmp/freellmapi-models.json", encoding="utf-8") as f:
              data = json.load(f)
          if not isinstance(data.get("data"), list) or not data["data"]:
              raise SystemExit("FreeLLMAPI model list is empty or invalid.")
          print(f"FreeLLMAPI reachable; {len(data['data'])} model entries listed. No inference request sent.")
          PY
              then
                READY=true
              else
                echo "::warning::FreeLLMAPI returned an invalid model list; using the configured fallback."
              fi
            else
              echo "::warning::FreeLLMAPI is unreachable; the workflow will use the configured fallback."
            fi
          else
            echo "FreeLLMAPI URL/key not configured; skipping gateway."
          fi
          echo "ready=$READY" >> "$GITHUB_OUTPUT"
      - name: Configure free-tier providers
        if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
        id: configure
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_MODEL: ${{ vars.CLOUDFLARE_MODEL || '@cf/zai-org/glm-4.7-flash' }}
          ALLOW_NONFREE_LLM_FALLBACK: ${{ vars.ALLOW_NONFREE_LLM_FALLBACK || 'false' }}
          FREELLMAPI_BASE_URL: ${{ steps.freeapi.outputs.ready == 'true' && secrets.FREELLMAPI_BASE_URL || '' }}
          FREELLMAPI_API_KEY: ${{ steps.freeapi.outputs.ready == 'true' && secrets.FREELLMAPI_API_KEY || '' }}
          FREELLMAPI_MODEL: ${{ steps.freeapi.outputs.ready == 'true' && secrets.FREELLMAPI_MODEL || 'auto' }}
          OMNIROUTE_BASE_URL: ${{ secrets.OMNIROUTE_BASE_URL }}
          OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
          OMNIROUTE_MODEL: ${{ secrets.OMNIROUTE_MODEL }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python scripts/configure_moneyprinter.py
      - name: Install the official engine
        if: ${{ steps.configure.outputs.ready == 'true' }}
        working-directory: vendor/MoneyPrinterTurbo
        run: |
          python -m pip install --upgrade pip
          pip install .
      - name: Load the preserved four topics
        if: ${{ steps.configure.outputs.ready == 'true' && inputs.use_previous_four_topics == true }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          topics = json.loads(Path("data/previous_four_topics.json").read_text(encoding="utf-8"))
          if not isinstance(topics, list) or len(topics) != 4:
              raise SystemExit("The preserved topic file must contain exactly four topics.")
          if len({row.get("video_subject") for row in topics}) != 4:
              raise SystemExit("Preserved topic names must be unique.")
          if any(row.get("video_aspect") != "9:16" or row.get("video_count") != 1 for row in topics):
              raise SystemExit("Preserved batch must contain four single 9:16 videos.")
          Path("trending_batch.json").write_text(json.dumps(topics, ensure_ascii=False, indent=2), encoding="utf-8")
          state_dir = Path(os.environ["MPT_HOME"]) / "state"
          state_dir.mkdir(parents=True, exist_ok=True)
          seen_file = state_dir / "seen_topics.json"
          try:
              seen = set(json.loads(seen_file.read_text(encoding="utf-8")))
          except FileNotFoundError:
              seen = set()
          except (OSError, ValueError) as exc:
              raise SystemExit(f"Could not read topic history safely: {exc}")
          seen.update(row["video_subject"].strip() for row in topics)
          seen_file.write_text(json.dumps(sorted(seen), ensure_ascii=False, indent=2), encoding="utf-8")
          print("PRESERVED_FOUR_TOPICS_LOADED_AND_RECORDED")
          PY
      - name: Discover fresh trending topics
        if: ${{ steps.configure.outputs.ready == 'true' && inputs.use_previous_four_topics != true }}
        run: python scripts/build_trending_batch.py --count 4 --geo US --state-dir "$MPT_HOME/state"
      - name: Research recent competing YouTube Shorts
        if: ${{ steps.configure.outputs.ready == 'true' }}
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if [ -z "$YOUTUBE_API_KEY" ]; then
            echo "::error::YOUTUBE_API_KEY is required for viral-pattern research; refusing to generate unresearched videos."
            exit 1
          fi
          python scripts/research_youtube_competitors.py --input trending_batch.json --output youtube_competitor_research.json --days 30 --max-results 20
      - name: Generate per-video YouTube SEO metadata drafts
        if: ${{ steps.configure.outputs.ready == 'true' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_MODEL: ${{ vars.CLOUDFLARE_MODEL || '@cf/zai-org/glm-4.7-flash' }}
          ALLOW_NONFREE_LLM_FALLBACK: ${{ vars.ALLOW_NONFREE_LLM_FALLBACK || 'false' }}
          FREELLMAPI_BASE_URL: ${{ steps.freeapi.outputs.ready == 'true' && secrets.FREELLMAPI_BASE_URL || '' }}
          FREELLMAPI_API_KEY: ${{ steps.freeapi.outputs.ready == 'true' && secrets.FREELLMAPI_API_KEY || '' }}
          FREELLMAPI_MODEL: ${{ steps.freeapi.outputs.ready == 'true' && secrets.FREELLMAPI_MODEL || 'auto' }}
          OMNIROUTE_BASE_URL: ${{ secrets.OMNIROUTE_BASE_URL }}
          OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
          OMNIROUTE_MODEL: ${{ secrets.OMNIROUTE_MODEL }}
          SEO_GEMINI_MODEL: gemini-3.8-flash
        run: python scripts/generate_seo_metadata.py --input trending_batch.json --output seo_metadata.json --language English --research youtube_competitor_research.json --require-viral-research --require-ai-batch
      - name: Validate generated SEO metadata
        if: ${{ steps.configure.outputs.ready == 'true' }}
        run: python scripts/validate_seo_metadata.py --input seo_metadata.json --expected-count 4
      - name: Install Pillow for thumbnail drafts
        if: ${{ steps.configure.outputs.ready == 'true' }}
        run: python -m pip install Pillow
      - name: Render reviewable thumbnail drafts
        if: ${{ steps.configure.outputs.ready == 'true' }}
        run: python scripts/render_seo_thumbnails.py --input seo_metadata.json --output-dir seo_thumbnails
      - name: Generate four vertical videos with transient-error retries (no upload)
        if: ${{ steps.configure.outputs.ready == 'true' }}
        working-directory: vendor/MoneyPrinterTurbo
        run: |
          python "$GITHUB_WORKSPACE/scripts/run_mpt_batch_with_retry.py" --batch-file "$GITHUB_WORKSPACE/trending_batch.json" --video-source ${{ steps.configure.outputs.video_source }} --max-attempts 3 --retry-delay-seconds 20
      - name: Translate and burn Persian subtitles
        if: ${{ steps.configure.outputs.ready == 'true' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_MODEL: ${{ vars.CLOUDFLARE_MODEL || '@cf/zai-org/glm-4.7-flash' }}
          ALLOW_NONFREE_LLM_FALLBACK: ${{ vars.ALLOW_NONFREE_LLM_FALLBACK || 'false' }}
          OMNIROUTE_BASE_URL: ${{ secrets.OMNIROUTE_BASE_URL }}
          OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
          OMNIROUTE_MODEL: ${{ secrets.OMNIROUTE_MODEL }}
          FREELLMAPI_BASE_URL: ${{ steps.freeapi.outputs.ready == 'true' && secrets.FREELLMAPI_BASE_URL || '' }}
          FREELLMAPI_API_KEY: ${{ steps.freeapi.outputs.ready == 'true' && secrets.FREELLMAPI_API_KEY || '' }}
          FREELLMAPI_MODEL: ${{ steps.freeapi.outputs.ready == 'true' && secrets.FREELLMAPI_MODEL || 'auto' }}
          MPT_HOME: ${{ env.MPT_HOME }}
          SEO_GEMINI_MODEL: gemini-3.8-flash
        run: python scripts/add_persian_subtitles.py
      - name: Validate generated vertical videos
        if: ${{ steps.configure.outputs.ready == 'true' }}
        env:
          EXPECTED_COUNT: "4"
        run: python scripts/validate_mpt_outputs.py
      - name: Compare sampled frames for visual uniqueness
        if: ${{ steps.configure.outputs.ready == 'true' }}
        run: python scripts/validate_visual_uniqueness.py --home "$MPT_HOME" --expected-count 4 --samples 6 --max-hamming-distance 5 --minimum-matching-frames 2
      - name: Install YouTube API client
        if: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && steps.configure.outputs.ready == 'true' }}
        run: python -m pip install --upgrade google-api-python-client google-auth-httplib2
      - name: Validate YouTube OAuth refresh token (no upload)
        if: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && steps.configure.outputs.ready == 'true' }}
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python scripts/check_youtube_auth.py
      - name: Publish all four videos PUBLIC on YouTube
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_four_public == true && steps.configure.outputs.ready == 'true' }}
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY_STATUS: public
          CONFIRM_PUBLIC_PUBLISHING: YES
          YOUTUBE_SCHEDULED_PUBLISH: NO
        run: python scripts/upload_four_private_youtube_tests.py
      - name: Schedule four videos for staggered PUBLIC release
        if: ${{ github.event_name == 'schedule' && steps.configure.outputs.ready == 'true' }}
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY_STATUS: private
          YOUTUBE_SCHEDULED_PUBLISH: YES
        run: python scripts/upload_four_private_youtube_tests.py
      - name: Upload all four PRIVATE YouTube QA videos
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_four_private_tests == true && inputs.publish_four_public != true && steps.configure.outputs.ready == 'true' }}
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY_STATUS: private
        run: python scripts/upload_four_private_youtube_tests.py
      - name: Upload one PRIVATE YouTube connection test
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_private_test == true && inputs.upload_four_private_tests != true && inputs.publish_four_public != true && steps.configure.outputs.ready == 'true' }}
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python scripts/upload_private_youtube_test.py
      - name: Persist topic and publication history
        if: ${{ always() && steps.configure.outputs.ready == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/mpt-runtime/state
          key: mpt-topics-${{ runner.os }}-${{ github.run_id }}
      - name: Collect output files
        if: ${{ always() }}
        run: |
          mkdir -p artifacts
          if [ -d "$MPT_HOME/storage/tasks" ]; then cp -R "$MPT_HOME/storage/tasks" artifacts/; fi
          if [ -d "$MPT_HOME/logs" ]; then cp -R "$MPT_HOME/logs" artifacts/; fi
          cp trending_batch.json selected_trends.json batch_retry_report.json seo_metadata.json youtube_competitor_research.json 2>/dev/null artifacts/ || true
          cp mpt_quality_report.json visual_uniqueness_report.json youtube_private_upload_results.json youtube_public_upload_results.json youtube_scheduled_upload_results.json artifacts/ 2>/dev/null || true
          if [ -d seo_thumbnails ]; then cp -R seo_thumbnails artifacts/; fi
      - name: Save videos, selected topics and logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: moneyprinterturbo-quality-test
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
