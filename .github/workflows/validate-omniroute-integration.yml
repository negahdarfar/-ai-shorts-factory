name: Validate OmniRoute Integration

on:
  pull_request:
    paths:
      - "scripts/add_persian_subtitles.py"
      - "tests/test_omniroute_translation.py"
      - ".github/workflows/validate-omniroute-integration.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/add_persian_subtitles.py"
      - "tests/test_omniroute_translation.py"
      - ".github/workflows/validate-omniroute-integration.yml"

permissions:
  contents: read

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile subtitle integration
        run: python -m py_compile scripts/add_persian_subtitles.py
      - name: Test translation response validation
        run: python -m unittest tests/test_omniroute_translation.py
