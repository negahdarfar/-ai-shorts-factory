name: Deploy OmniRoute VPS

on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: "Deploy/update the persistent OmniRoute service on the configured VPS"
        required: true
        type: choice
        options:
          - "no"
          - "yes"
        default: "no"

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ inputs.confirm_deploy == 'yes' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMNIROUTE_SSH_HOST: ${{ secrets.OMNIROUTE_SSH_HOST }}
      OMNIROUTE_SSH_USER: ${{ secrets.OMNIROUTE_SSH_USER }}
      OMNIROUTE_SSH_PRIVATE_KEY: ${{ secrets.OMNIROUTE_SSH_PRIVATE_KEY }}
      OMNIROUTE_SSH_KNOWN_HOSTS: ${{ secrets.OMNIROUTE_SSH_KNOWN_HOSTS }}
      OMNIROUTE_SSH_PORT: ${{ secrets.OMNIROUTE_SSH_PORT }}
      OMNIROUTE_INITIAL_PASSWORD: ${{ secrets.OMNIROUTE_INITIAL_PASSWORD }}
    steps:
      - name: Checkout deployment files
        uses: actions/checkout@v4

      - name: Validate deployment secrets and prepare SSH
        run: |
          set -euo pipefail
          for name in OMNIROUTE_SSH_HOST OMNIROUTE_SSH_USER OMNIROUTE_SSH_PRIVATE_KEY OMNIROUTE_SSH_KNOWN_HOSTS OMNIROUTE_INITIAL_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret: $name"
              exit 1
            fi
          done
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$OMNIROUTE_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$OMNIROUTE_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -l -f ~/.ssh/known_hosts >/dev/null
          echo "SSH credentials loaded; secret values are not printed."

      - name: Transfer persistent gateway deployment files
        env:
          SSH_PORT: ${{ secrets.OMNIROUTE_SSH_PORT || '22' }}
        run: |
          set -euo pipefail
          TARGET="$OMNIROUTE_SSH_USER@$OMNIROUTE_SSH_HOST"
          tar -czf - -C deploy/omniroute . | \
            ssh -p "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$TARGET" \
            'mkdir -p "$HOME/omniroute-gateway" && tar -xzf - -C "$HOME/omniroute-gateway"'

      - name: Bootstrap secrets once and start OmniRoute
        env:
          SSH_PORT: ${{ secrets.OMNIROUTE_SSH_PORT || '22' }}
        run: |
          set -euo pipefail
          TARGET="$OMNIROUTE_SSH_USER@$OMNIROUTE_SSH_HOST"
          printf '%s\n' "$OMNIROUTE_INITIAL_PASSWORD" | \
            ssh -p "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$TARGET" \
            'set -eu
             cd "$HOME/omniroute-gateway"
             IFS= read -r ADMIN_PASSWORD
             if [ ! -f .env ]; then
               umask 077
               printf "JWT_SECRET=%s\nAPI_KEY_SECRET=%s\nINITIAL_PASSWORD=%s\nDATA_DIR=/data\nREQUIRE_API_KEY=true\n" \
                 "$(openssl rand -base64 48)" "$(openssl rand -hex 32)" "$ADMIN_PASSWORD" > .env
             fi
             docker compose up -d --build
             docker compose ps'
