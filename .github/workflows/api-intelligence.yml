name: KOROUSH API Intelligence

on:
  push:
    branches:
      - feature/api-intelligence-v1
  pull_request:
    paths:
      - 'scripts/api_intelligence.py'
      - 'scripts/github_project_scout.py'
      - 'tests/test_api_intelligence.py'
      - 'tests/test_github_project_scout.py'
      - '.github/workflows/api-intelligence.yml'
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * 1"

permissions:
  contents: read

concurrency:
  group: api-intelligence-readonly
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency\n        run: python -m pip install Pillow\n      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Discover API candidates and check selected catalogue links
        run: python scripts/api_intelligence.py --check --check-limit 12 --output-dir api-intelligence-report
      - name: Discover relevant open-source GitHub projects
        run: python scripts/github_project_scout.py
      - name: Upload discovery report
        uses: actions/upload-artifact@v4
        with:
          name: koroush-api-intelligence
          path: api-intelligence-report/
          if-no-files-found: error
          retention-days: 14
