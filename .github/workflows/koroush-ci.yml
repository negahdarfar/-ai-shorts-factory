name: Koroush AI - shorts-factory validation

on:
  push:
    branches: ["shorts-factory"]
    paths:
      - "koroush_core/**"
      - "tests/**"
      - ".github/workflows/koroush-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: koroush-shorts-factory-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Compile Python sources
        run: python -m compileall -q koroush_core tests
      - name: Run shared quality tests
        run: python -m unittest discover -s tests -v
      - name: Verify FFmpeg toolchain
        run: |
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
