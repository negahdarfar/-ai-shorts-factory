name: Koroush AI - viral-video-studio validation

on:
  push:
    branches: ["viral-video-studio"]
    paths:
      - "koroush_core/**"
      - "scripts/**"
      - "tests/**"
      - "viral_factory/**"
      - ".github/workflows/koroush-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: koroush-viral-video-studio-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Verify FFmpeg tools
        run: |
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Compile Python sources
        run: python -m compileall -q koroush_core scripts tests viral_factory
      - name: Run shared quality tests
        run: |
          python -m unittest discover -s tests -v
          python -m unittest discover -s viral_factory -p 'test_*.py' -v
      - name: Verify FFmpeg toolchain
        run: |
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
