name: Weekly Shorts Optimization

on:
  schedule:
    - cron: "30 6 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: weekly-shorts-optimization
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout factory
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore factory upload ledger
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/mpt-runtime/state
          key: mpt-topics-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            mpt-topics-${{ runner.os }}-
      - name: Download the latest completed analytics report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          run_id="$(gh run list --workflow youtube-analytics.yml --branch short-video-studio --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            echo "::error::No completed YouTube Analytics run is available."
            exit 1
          fi
          mkdir -p analytics-artifact
          gh run download "$run_id" --name youtube-analytics-report --dir analytics-artifact
          test -s analytics-artifact/youtube_analytics.json

      - name: Generate weekly optimization recommendations
        run: python scripts/weekly_optimization.py --input analytics-artifact/youtube_analytics.json --upload-history "$GITHUB_WORKSPACE/mpt-runtime/state/upload_history.json" --output weekly_optimization.json --markdown weekly_optimization.md

      - name: Refresh dashboard with optimization report
        run: python scripts/build_factory_dashboard.py --analytics analytics-artifact/youtube_analytics.json --optimization weekly_optimization.json --output factory_dashboard.html

      - name: Save weekly optimization artifact
        uses: actions/upload-artifact@v4
        with:
          name: weekly-shorts-optimization
          path: |
            weekly_optimization.json
            weekly_optimization.md
            factory_dashboard.html
          if-no-files-found: error
          retention-days: 30
