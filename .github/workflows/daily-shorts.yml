
name: AI Shorts Factory

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * *"

permissions:
  contents: read

jobs:
  create-shorts:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Discover reusable videos
        run: python source_discovery.py

      - name: Download selected video
        run: python download_video.py

      - name: Generate four Shorts
        run: python main.py

      - name: Create source attribution
        run: python attribution.py

      - name: Save generated Shorts
        uses: actions/upload-artifact@v4
        with:
          name: viralnovalabs-shorts
          path: |
            output/*.mp4
            source_metadata.json
            best_clips.json
            output/attribution.txt
          if-no-files-found: error
          retention-days: 3
