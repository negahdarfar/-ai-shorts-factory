name: Factory lightweight CI
on:
  pull_request:
    branches: [main, feat/avgen-free-local-renderer-bridge]
  push:
    branches: [main, feature/youtube-seo-metadata]
permissions:
  contents: read
jobs:
  # Regression tests also cover the Persian subtitle and visual-diversity pipeline.
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip Pillow
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile scripts/*.py
