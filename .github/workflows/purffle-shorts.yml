name: PurffleShorts Video Engine

on:
  workflow_dispatch:
    inputs:
      count:
        description: "Number of Shorts to generate (1-4)"
        required: true
        type: choice
        options: ["1", "2", "3", "4"]
        default: "1"
      publish_public:
        description: "Upload completed videos publicly to the connected YouTube channel"
        required: true
        type: boolean
        default: true
      use_phone_gateway:
        description: "Use the private Android FreeLLMAPI gateway over Tailscale"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: purffle-shorts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      FREELLMAPI_CLOUD_BASE_URL: ${{ secrets.FREELLMAPI_CLOUD_BASE_URL }}
      FREELLMAPI_CLOUD_API_KEY: ${{ secrets.FREELLMAPI_CLOUD_API_KEY }}
      FREELLMAPI_BASE_URL: ${{ secrets.FREELLMAPI_BASE_URL }}
      FREELLMAPI_API_KEY: ${{ secrets.FREELLMAPI_API_KEY }}
      FREELLMAPI_MODEL: ${{ secrets.FREELLMAPI_MODEL || 'auto' }}
      TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
      COUNT: ${{ inputs.count }}
      PUBLISH_PUBLIC: ${{ inputs.publish_public }}
    steps:
      - name: Checkout factory
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core

      - name: Connect to private phone gateway
        if: ${{ inputs.use_phone_gateway == true }}
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Select FreeLLMAPI endpoint and validate existing secrets
        shell: bash
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "$PUBLISH_PUBLIC" == "true" ]]; then
            : "${YOUTUBE_CLIENT_ID:?Missing YOUTUBE_CLIENT_ID GitHub secret}"
            : "${YOUTUBE_CLIENT_SECRET:?Missing YOUTUBE_CLIENT_SECRET GitHub secret}"
            : "${YOUTUBE_REFRESH_TOKEN:?Missing YOUTUBE_REFRESH_TOKEN GitHub secret}"
          fi
          if [[ "${{ inputs.use_phone_gateway }}" == "true" || -z "${FREELLMAPI_CLOUD_BASE_URL:-}" ]]; then
            : "${FREELLMAPI_BASE_URL:?Missing FREELLMAPI_BASE_URL GitHub secret}"
            : "${FREELLMAPI_API_KEY:?Missing FREELLMAPI_API_KEY GitHub secret}"
            : "${TAILSCALE_AUTHKEY:?Missing TAILSCALE_AUTHKEY GitHub secret}"
            echo "LLM_BASE_URL=$FREELLMAPI_BASE_URL" >> "$GITHUB_ENV"
            echo "LLM_API_KEY=$FREELLMAPI_API_KEY" >> "$GITHUB_ENV"
          else
            : "${FREELLMAPI_CLOUD_BASE_URL:?Missing FREELLMAPI_CLOUD_BASE_URL GitHub secret}"
            : "${FREELLMAPI_CLOUD_API_KEY:?Missing FREELLMAPI_CLOUD_API_KEY GitHub secret}"
            echo "LLM_BASE_URL=$FREELLMAPI_CLOUD_BASE_URL" >> "$GITHUB_ENV"
            echo "LLM_API_KEY=$FREELLMAPI_CLOUD_API_KEY" >> "$GITHUB_ENV"
          fi
          echo "LLM_PROVIDER=custom" >> "$GITHUB_ENV"
          echo "LLM_MODEL=$FREELLMAPI_MODEL" >> "$GITHUB_ENV"
          echo "LLM_FALLBACKS=" >> "$GITHUB_ENV"
          echo "UPLOAD=$PUBLISH_PUBLIC" >> "$GITHUB_ENV"
          echo "YT_PRIVACY=public" >> "$GITHUB_ENV"

      - name: Preflight FreeLLMAPI connectivity
        shell: bash
        run: |
          set -euo pipefail
          # A non-000 HTTP status proves that the API host answered. 401/404
          # are still useful connectivity signals; the generation step will
          # report authentication or route errors separately.
          probe_url="${LLM_BASE_URL%/}/models"
          echo "Checking FreeLLMAPI reachability (no credentials are printed)..."
          set +e
          http_code="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --connect-timeout 8 --max-time 12 \
            --header "Authorization: Bearer $LLM_API_KEY" "$probe_url" 2>/dev/null)"
          curl_status=$?
          set -e
          if [[ "$curl_status" -ne 0 || "$http_code" == "000" || -z "$http_code" ]]; then
            echo "::error::FreeLLMAPI is unreachable from this GitHub runner. Check that the Android FreeLLMAPI server is running, listening on the Tailscale interface, and accepting connections on port 3001. No video generation was started."
            exit 1
          fi
          echo "FreeLLMAPI host responded with HTTP $http_code; continuing to the generation step."

      - name: Install pinned PurffleShorts 3.1.0
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/Chamanrajragu/purffle-shorts.git@514fd2547227b98d951dfc1489fc8c7ce72f1b68"

      - name: Create YouTube OAuth refresh-token file
        if: ${{ inputs.publish_public == true }}
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          required = ("YOUTUBE_CLIENT_ID", "YOUTUBE_CLIENT_SECRET", "YOUTUBE_REFRESH_TOKEN")
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit("Missing YouTube OAuth secrets: " + ", ".join(missing))
          token = {
              "type": "authorized_user",
              "client_id": os.environ["YOUTUBE_CLIENT_ID"],
              "client_secret": os.environ["YOUTUBE_CLIENT_SECRET"],
              "refresh_token": os.environ["YOUTUBE_REFRESH_TOKEN"],
              "token_uri": "https://oauth2.googleapis.com/token",
              "scopes": ["https://www.googleapis.com/auth/youtube.upload"],
          }
          path = Path("purffle-token.json")
          path.write_text(json.dumps(token), encoding="utf-8")
          path.chmod(0o600)
          PY

      - name: Generate Shorts with PurffleShorts and publish
        env:
          LLM_PROVIDER: custom
          LLM_BASE_URL: ${{ inputs.use_phone_gateway && secrets.FREELLMAPI_BASE_URL || (secrets.FREELLMAPI_CLOUD_BASE_URL == '' && secrets.FREELLMAPI_BASE_URL) || secrets.FREELLMAPI_CLOUD_BASE_URL }}
          LLM_API_KEY: ${{ inputs.use_phone_gateway && secrets.FREELLMAPI_API_KEY || (secrets.FREELLMAPI_CLOUD_BASE_URL == '' && secrets.FREELLMAPI_API_KEY) || secrets.FREELLMAPI_CLOUD_API_KEY }}
          LLM_MODEL: ${{ secrets.FREELLMAPI_MODEL || 'auto' }}
          LLM_FALLBACKS: ""
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          LANGUAGE: en
          SCRIPT_STYLE: auto
          TOPIC_SOURCES: niche,search,trending
          NICHES: "science and space, psychology, technology, fascinating true stories, history"
          TARGET_SECONDS: "45"
          ASPECT: "9:16"
          RESOLUTION: "1080x1920"
          TTS_ENGINE: edge
          VISUAL_SOURCES: pexels,pixabay
          CAPTION_STYLE: bold
          CAPTION_EMPHASIS: "true"
          SOUND_EFFECTS: "true"
          SYNTHETIC_MEDIA: "true"
          YT_TOKEN_FILE: purffle-token.json
          YT_PRIVACY: public
          UPLOAD: ${{ inputs.publish_public && 'true' || 'false' }}
          PUBLISH_TO: youtube
          YT_DAILY_LIMIT: "4"
          KEEP_VIDEOS: "true"
          OUTPUT_DIR: output_videos
          DATA_DIR: data/purffle
          SCRIPT_REVIEW: rewrite
          LLM_JSON_SCHEMA: "true"
        run: |
          set -euo pipefail
          purffle-shorts doctor
          purffle-shorts make --count "$COUNT" --duration 45 --aspect 9:16 --provider custom --style auto --lang en --privacy public

      - name: Save rendered videos and logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: purffle-shorts-output
          path: |
            output_videos/
            data/purffle/
          if-no-files-found: warn
          retention-days: 7
