services:
  omniroute:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: omniroute
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATA_DIR: /data
      PORT: "20128"
      REQUIRE_API_KEY: "true"
    ports:
      # Keep the gateway private on the VPS; expose it through HTTPS Caddy.
      - "127.0.0.1:20128:20128"
    volumes:
      - omniroute_data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:20128/api/monitoring/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

volumes:
  omniroute_data:
